name: Deploy frontend to Vercel

# Runs on every push to main, so the live site always matches what's merged.
# Doesn't need repo admin access (unlike Vercel's GitHub App integration) —
# just the VERCEL_TOKEN repo secret.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Not secret — just identifiers for which Vercel project to target.
      # .vercel/project.json is gitignored, so CI needs these explicitly.
      VERCEL_ORG_ID: team_dwf5WWnvhBOo8SmNungJQw3S
      VERCEL_PROJECT_ID: prj_OJvXhX6hUR9HYr97MMgn1FTfQKL3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull Vercel environment
        working-directory: frontend
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: frontend
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: frontend
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
